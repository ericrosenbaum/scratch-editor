<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="songsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F7FC"/>
      <stop offset="1" stop-color="#E1E7F4"/>
    </linearGradient>
    <filter id="songsCardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2A3A6E" flood-opacity="0.16"/>
    </filter>
    <filter id="songsPlayShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4C97FF" flood-opacity="0.45"/>
    </filter>
    <clipPath id="songsCardClip">
      <rect x="20" y="32" width="160" height="120" rx="16"/>
    </clipPath>
  </defs>

  <!-- Airy editor background -->
  <rect width="200" height="200" rx="32" fill="url(#songsBg)"/>

  <!-- Piano-roll card -->
  <rect x="20" y="32" width="160" height="120" rx="16" fill="#FFFFFF" filter="url(#songsCardShadow)"/>

  <g clip-path="url(#songsCardClip)">
    <!-- Keyboard gutter -->
    <rect x="20" y="32" width="22" height="120" fill="#F4F6FB"/>
    <!-- White-key separators / lane rows -->
    <g stroke-width="1">
      <line x1="20" y1="49.1" x2="42" y2="49.1" stroke="#DCE0EA"/>
      <line x1="20" y1="66.3" x2="42" y2="66.3" stroke="#DCE0EA"/>
      <line x1="20" y1="83.4" x2="42" y2="83.4" stroke="#DCE0EA"/>
      <line x1="20" y1="100.6" x2="42" y2="100.6" stroke="#DCE0EA"/>
      <line x1="20" y1="117.7" x2="42" y2="117.7" stroke="#DCE0EA"/>
      <line x1="20" y1="134.9" x2="42" y2="134.9" stroke="#DCE0EA"/>
      <line x1="42" y1="49.1" x2="180" y2="49.1" stroke="#EDEFF6"/>
      <line x1="42" y1="66.3" x2="180" y2="66.3" stroke="#EDEFF6"/>
      <line x1="42" y1="83.4" x2="180" y2="83.4" stroke="#EDEFF6"/>
      <line x1="42" y1="100.6" x2="180" y2="100.6" stroke="#EDEFF6"/>
      <line x1="42" y1="117.7" x2="180" y2="117.7" stroke="#EDEFF6"/>
      <line x1="42" y1="134.9" x2="180" y2="134.9" stroke="#EDEFF6"/>
    </g>
    <!-- Black keys (grouped 2 + 3, like a real keyboard) -->
    <g fill="#2C2C2C">
      <rect x="20" y="44.6" width="12" height="9" rx="2"/>
      <rect x="20" y="61.8" width="12" height="9" rx="2"/>
      <rect x="20" y="96.1" width="12" height="9" rx="2"/>
      <rect x="20" y="113.2" width="12" height="9" rx="2"/>
      <rect x="20" y="130.4" width="12" height="9" rx="2"/>
    </g>
    <!-- Faint beat lines -->
    <g stroke="#F0F2F8" stroke-width="1">
      <line x1="62" y1="32" x2="62" y2="152"/>
      <line x1="158" y1="32" x2="158" y2="152"/>
    </g>
    <!-- Playhead -->
    <line x1="110" y1="32" x2="110" y2="152" stroke="#4C97FF" stroke-width="2" opacity="0.5"/>
    <!-- Rainbow note pills (the song) -->
    <g stroke-width="1.5">
      <rect x="50" y="120.8" width="20" height="11" rx="3.5" fill="#FF6B6B" stroke="#B84F4F"/>
      <rect x="74" y="103.6" width="20" height="11" rx="3.5" fill="#FFCC4F" stroke="#B89337"/>
      <rect x="74" y="69.4" width="20" height="11" rx="3.5" fill="#4FB8E9" stroke="#3788A5"/>
      <rect x="98" y="86.5" width="20" height="11" rx="3.5" fill="#4FE974" stroke="#37A554"/>
      <rect x="122" y="52.2" width="20" height="11" rx="3.5" fill="#944FE9" stroke="#6A37A5"/>
      <rect x="122" y="103.6" width="20" height="11" rx="3.5" fill="#FF9F4F" stroke="#B87237"/>
      <rect x="146" y="69.4" width="20" height="11" rx="3.5" fill="#4FE9D9" stroke="#37A59C"/>
    </g>
  </g>

  <!-- Card hairline border -->
  <rect x="20" y="32" width="160" height="120" rx="16" fill="none" stroke="#E6E8F0" stroke-width="1"/>

  <!-- Play button accent -->
  <circle cx="168" cy="150" r="18" fill="#4C97FF" filter="url(#songsPlayShadow)"/>
  <path d="M163.5 142.5 L163.5 157.5 L177 150 Z" fill="#FFFFFF"/>
</svg>
